<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copy Desk — Fox Meyer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="topbar">
    <h1>Copy Desk <span class="muted">· Fox Meyer FR/EN</span></h1>
    <div id="top-actions">
      <button id="btn-refresh" title="Re-fetch products, pages, policies and theme translations from Shopify">Refresh from Shopify</button>
      <button id="btn-publish">Publish staged (<span id="staged-count">0</span>)</button>
      <span class="export-links">Export:
        <a href="/api/export/csv">CSV</a> ·
        <a href="/api/export/json">JSON</a> ·
        <a href="/api/export/xliff">XLIFF</a>
      </span>
    </div>
  </header>
  <div id="banner" hidden></div>
  <main>
    <nav id="groups"></nav>
    <section id="content">
      <div id="filterbar">
        <label><input type="checkbox" id="filter-untranslated"> Untranslated FR only</label>
        <input type="search" id="search" placeholder="Search copy…">
        <button id="btn-ai-group" hidden
          title="AI-transcreate every untranslated FR entry in this group. Results are saved to the FR locale file (review via git diff) or staged for Shopify (review before Publish) — nothing goes live without you.">
          ✦ AI-fill missing FR (group)</button>
      </div>
      <div id="rows"></div>
    </section>
  </main>
  <div id="toast" hidden></div>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
